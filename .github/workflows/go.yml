name: Go

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet -tags goolm ./...
      - run: go test -tags goolm ./...
      - run: go build -tags goolm ./cmd/mautrix-imessage
